services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - flowvia-mongodb:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flowvia-redis:/data
    command: redis-server --appendonly yes

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/flowvia
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis

volumes:
  flowvia-mongodb:
  flowvia-redis:
